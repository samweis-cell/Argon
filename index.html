<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argon – Deine Lernplattform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <!-- KaTeX für echte Mathe-Formeln (LaTeX) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="title-group">
                <h1 id="app-title" style="cursor: pointer;">⚡ Argon</h1>
                <span class="version-badge">V.1.0.4</span>
            </div>
            <button id="add-btn" class="primary-btn">+ Neu</button>
        </div>
        <input type="text" id="search-input" placeholder="Nach Vokabel, Formel oder Thema suchen...">
    </header>

    <main id="main-container">
        <!-- Entweder Fächer-Kacheln (Startseite) oder die Karten-Ansicht eines Faches -->
    </main>

    <!-- Modal zum Hinzufügen & Bearbeiten von Einträgen -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Neuer Eintrag</h2>
            <form id="entry-form">
                <input type="hidden" id="entry-id">

                <label>Fach:
                    <select id="entry-subject" required>
                        <option value="griechisch">🏛️ Griechisch</option>
                        <option value="mathe">📐 Mathe</option>
                        <option value="physik">⚡ Physik</option>
                        <option value="chemie">🧪 Chemie</option>
                    </select>
                </label>

                <label>Typ:
                    <select id="entry-type" required>
                        <option value="vocab">Vokabel (Karteikarte)</option>
                        <option value="formula">Formel / Regel (LaTeX möglich)</option>
                    </select>
                </label>

                <label>Vorderseite / Formel / Wort:
                    <input type="text" id="entry-front" required>
                </label>

                <label>Rückseite / Übersetzung / Bedeutung:
                    <input type="text" id="entry-back" required>
                </label>

                <label>Zusatzinfo (Stammformen, Variablen, Thema):
                    <textarea id="entry-details" rows="2"></textarea>
                </label>

                <div class="modal-actions">
                    <button type="button" id="close-modal" class="secondary-btn">Abbrechen</button>
                    <button type="submit" class="primary-btn">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
